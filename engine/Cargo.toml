[package]
name = "kobayashi-marust"
version = "0.2.1"
edition = "2021"
license = "BSD-3-Clause"
description = "A sound disjunctive context-based (consequence-based) reasoner for SROIQ / OWL 2 DL, with machine-checked soundness in Lean 4."
repository = "https://github.com/bio-ontology-research-group/kobayashi-marust"
keywords = ["description-logic", "owl", "reasoner", "sroiq", "lean"]
categories = ["science"]

[lib]
name = "kobayashi_marust"
path = "src/lib.rs"

[[bin]]
name = "kobayashi-marust"
path = "src/main.rs"

[[bin]]
name = "ofn"
path = "src/bin/ofn.rs"

[[bin]]
name = "elc"
path = "src/bin/elc.rs"

[[bin]]
name = "km"
path = "src/bin/km.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
smallvec = "1"
libc = "0.2"
horned-owl = { version = "1.4", default-features = false }
oxrdfio = "0.2"
dhat = { version = "0.3", optional = true }

[features]
# Heap profiling: builds the binaries with dhat's instrumented global
# allocator. Off by default, so the normal release build is unaffected.
dhat-heap = ["dhat"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
