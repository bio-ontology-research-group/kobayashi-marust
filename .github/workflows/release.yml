name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish source release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify version tag
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' engine/Cargo.toml | head -n1)
          test "v${version}" = "$RELEASE_TAG"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${RELEASE_TAG#v}
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { emit=1 }
            emit && $0 ~ "^## \\[" && $0 !~ "^## \\[" version "\\]" { exit }
            emit { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "KM ${RELEASE_TAG}" \
              --notes-file release-notes.md
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "KM ${RELEASE_TAG}" \
            --notes-file release-notes.md
