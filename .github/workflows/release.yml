name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish source release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify version tag
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' engine/Cargo.toml | head -n1)
          test "v${version}" = "$RELEASE_TAG"
      - name: Verify prevalidated release assets
        if: env.RELEASE_TAG == 'v1.5.2'
        run: python3 .github/scripts/release_assets.py
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${RELEASE_TAG#v}
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { emit=1 }
            emit && $0 ~ "^## \\[" && $0 !~ "^## \\[" version "\\]" { exit }
            emit { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          if test "$RELEASE_TAG" = "v1.5.2"; then
            # Fresh release only. Never hide or rewrite an existing publication.
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "v1.5.2 already exists; inspect the prior attempt before recovery" >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft \
              --title "KM ${RELEASE_TAG}" \
              --notes-file release-notes.md
            exit 0
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "KM ${RELEASE_TAG}" \
              --notes-file release-notes.md
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "KM ${RELEASE_TAG}" \
            --notes-file release-notes.md
      - name: Upload verified release assets and publish draft
        if: env.RELEASE_TAG == 'v1.5.2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A partial prior upload requires investigation, never blind replacement.
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" = 0
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            release-assets/km-v1.5.2-linux-x86_64 \
            release-assets/km-v1.5.2-certified-source.tar.gz \
            release-assets/build-completion.json \
            release-assets/BENCHMARKS.md \
            release-assets/kobayashi-marust-protege-1.5.2.jar \
            release-assets/SHA256SUMS
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
