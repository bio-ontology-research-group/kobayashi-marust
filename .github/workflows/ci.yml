name: CI

on:
  # Full Rust and Lean validation is intentionally a milestone gate. Development
  # commits are validated locally; maintainers dispatch this workflow after a
  # major proof, engine, or release milestone is ready.
  workflow_dispatch:

jobs:
  engine:
    name: Rust engine (build + test)
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Build
        working-directory: engine
        run: cargo build --release --locked
      - name: Test
        working-directory: engine
        shell: bash
        run: |
          set +e
          # These source-bound tests intentionally fail closed without their
          # native Lean checker. The repository certification gates run every
          # skipped test with the matching checker; this job runs the remaining
          # Rust suite and never treats a missing checker as a test failure.
          checker_tests=(
            source_exact_taxonomy_uses_real_production_traces_and_models
            cardinality_decision_blocks_and_checks_a_cyclic_minimum
            cardinality_decision_emits_sat_or_unsat_checker_ready_evidence
            cardinality_frontier_distinguishes_minimum_siblings_and_lean_checks_it
            certified_unsat_refutation_deepens_past_the_historical_node_cap
            equality_and_cardinality_folds_copy_incoming_blocker_edges
            equality_decision_emits_sat_or_unsat_checker_ready_evidence
            equality_decision_pairwise_blocks_and_checks_a_satisfiable_cycle
            equality_free_decision_emits_sat_or_unsat_checker_ready_evidence
            global_decision_wraps_regular_evidence_for_the_main_lean_checker
            lean_preprocessing_wire_certifies_trigger_and_contrapositives
            lean_taxonomy_wire_covers_every_concept_and_ordered_pair
            lean_taxonomy_wire_uses_anchored_negative_cells_for_a_genuine_equality_head
            native_abox_cardinality_global_decision_uses_joint_wire
            native_abox_cardinality_taxonomy_matrix_is_joint_and_tamper_evident
            native_abox_global_decision_uses_joint_sat_wire
            native_abox_taxonomy_cells_use_one_joint_checked_state
            native_abox_taxonomy_matrix_is_complete_and_tamper_evident
            regular_decision_envelope_carries_finite_unsat_and_lean_checks_it
            regular_decision_prefers_a_checked_finite_sat_model
            joint_native_abox_classification_carries_one_source_and_abox
            joint_native_abox_source_matrix_passes_real_lean_checker_on_all_six_routes
          )
          skip_args=()
          for test_name in "${checker_tests[@]}"; do
            skip_args+=(--skip "$test_name")
          done
          cargo test --release --locked --lib -- \
            --test-threads=1 "${skip_args[@]}" 2>&1 | tee /tmp/km-test.log
          status=${PIPESTATUS[0]}
          if (( status == 0 )); then
            for source in tests/*.rs; do
              target=${source##*/}
              target=${target%.rs}
              case "$target" in
                cb_live_state|elc_certificate|ht_taxonomy_certificate)
                  continue
                  ;;
              esac
              cargo test --release --locked --test "$target" -- \
                --test-threads=1 2>&1 | tee -a /tmp/km-test.log
              status=${PIPESTATUS[0]}
              (( status == 0 )) || break
            done
          fi
          set -e
          if (( status != 0 )); then
            excerpt=$(tail -120 /tmp/km-test.log | python3 -c \
              'import sys; s=sys.stdin.read(); s=s[-3500:]; print(s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')
            echo "::error file=.github,line=1,title=Rust test failure::$excerpt"
            exit "$status"
          fi
      - name: Smoke test (disjunctive subsumption A ⊑ D)
        working-directory: engine
        run: |
          out=$(./target/release/kobayashi-marust < ../validation/inputs/disj.json)
          echo "$out"
          echo "$out" | grep -q '"A":\["D"\]'

  lean:
    name: Lean proofs (kernel-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and kernel-check the formalisation + all validation theorems
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
